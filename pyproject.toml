[project]
authors = [{name = "Hossein Ghorbanfekr"}]
description = "MD engine from scratch."
name = "amardus"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
ipykernel = ">=6.29.5,<7"
matplotlib = ">=3.10.0,<4"
numba = ">=0.61.0,<0.62"
scalene = ">=1.5.41,<2"
cuda-version = "12.3.*"
jupyterlab = ">=4.3.5,<5"
ase = ">=3.28.0,<4"
scipy = ">=1.17.1,<2"
lammps = ">=2024.8.29,<2025"
streamlit = ">=1.59.1,<2"

[tool.pixi.pypi-dependencies]
amardus = { path = ".", editable = true }

