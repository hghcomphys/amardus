[project]
authors = []
description = "MD engine from scratch."
name = "amardus"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [ "flax>=0.10.4,<0.11", "jax[cuda12]>=0.5.1,<0.6", "optax>=0.2.4,<0.3" ]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
ipykernel = ">=6.29.5,<7"
cuda-nvcc = "*"
cuda-nvprof = ">=12.3.101,<13"
cuda-cupti = ">=12.3.101,<13"
cuda-cudart = ">=12.3.101,<13"
nsight-compute = ">=2023.3.1.1,<2024"
matplotlib = ">=3.10.0,<4"
cupy = ">=13.3.0,<14"
numba = ">=0.61.0,<0.62"
linux-perf = ">=6.3.10,<7"
scalene = ">=1.5.41,<2"
cuda-version = "12.3.*"
jupyterlab = ">=4.3.5,<5"
ase = ">=3.28.0,<4"
scipy = ">=1.17.1,<2"
lammps = ">=2024.8.29,<2025"

[tool.pixi.pypi-dependencies]
amardus = { path = ".", editable = true }

